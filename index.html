<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><link rel="manifest" href="manifest.json"><title>Jean Performance V4</title>
<style>
:root{--bg:#0b0d10;--card:#12151a;--card2:#171a20;--line:#292e38;--muted:#9ca3af;--text:#f5f5f5;--accent:#fff;--ok:#9ae6b4;--warn:#f6d365}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:24px;font-weight:850}.muted{color:var(--muted)}.tiny{font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px;margin-bottom:16px}.tabs button{background:#171a20;color:#cbd5e1;border:1px solid #272b33;border-radius:12px;padding:10px 13px;white-space:nowrap}.tabs button.active{background:#f5f5f5;color:#111}.card{background:var(--card);border:1px solid #242832;border-radius:17px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{background:var(--card2);border-radius:13px;padding:12px}.stat b{display:block;font-size:22px;margin-top:5px}.daybar{display:flex;gap:7px;overflow:auto;margin:10px 0}.daybar button,.chip,.small{border:1px solid #303640;background:#191d24;color:#e5e7eb;border-radius:10px;padding:8px 10px}.daybar button.active,.chip.active{background:#fff;color:#111}.primary{background:#fff!important;color:#111!important;border-color:#fff!important}.sectiontitle{margin:21px 0 8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.foodcard{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.foodcard.done{border-color:#5a7d66}.foodhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.foodname{font-weight:800;font-size:16px}.mealoption{background:#0e1115;border:1px solid #252a32;border-radius:12px;padding:11px;margin-top:9px}.mealoption.selected{border-color:#e5e7eb}.mealoption .line{display:flex;justify-content:space-between;gap:8px;align-items:center}.ingredient{padding:3px 0;color:#d7dbe1}.macrogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.macro{background:#171a20;border-radius:9px;padding:8px}.macro span{display:block;color:#9ca3af;font-size:11px}.macro b{font-size:14px}.progress{height:9px;background:#222731;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#e9e9e9;border-radius:99px}.check{width:28px;height:28px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.input{background:#0d1014;color:#fff;border:1px solid #303640;border-radius:9px;padding:9px;width:100%}.miniinput{background:#0d1014;color:#fff;border:1px solid #303640;border-radius:8px;padding:7px;width:100%}.waterbar{height:13px;background:#20252d;border-radius:99px;overflow:hidden}.waterfill{height:100%;background:#eee}.exercise{border:1px solid #292e38;border-radius:14px;padding:13px;margin:10px 0}.exercise h3{margin:0 0 4px;font-size:16px}.meta{font-size:12px;color:#9ca3af}.sets{margin-top:10px}.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 30px;gap:6px;align-items:center;margin:6px 0}.setrow input{width:100%;background:#0c0f13;border:1px solid #303640;color:#fff;border-radius:8px;padding:8px}.setnum{color:#9ca3af;text-align:center}.volume{font-weight:700;margin-top:8px}.chart{width:100%;height:220px;background:#0d1014;border-radius:10px;border:1px solid #252a32;margin-top:10px}.summarylist{list-style:none;padding:0;margin:0}.summarylist li{padding:9px 0;border-bottom:1px solid #252a32;display:flex;justify-content:space-between;gap:10px}.notice{border-left:3px solid #777;padding:9px 11px;background:#171a20;border-radius:8px;margin:10px 0}.footer{color:#777;font-size:11px;text-align:center;margin-top:25px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:20}.modalbox{background:#12151a;border:1px solid #303640;border-radius:18px;padding:16px;max-width:700px;width:100%;max-height:88vh;overflow:auto}.hidden{display:none!important}.calendar{display:flex;gap:6px;overflow:auto}.calendar button{min-width:46px;border:1px solid #303640;background:#15181d;color:#fff;border-radius:10px;padding:8px}.calendar button.active{background:#fff;color:#111}.tag{font-size:11px;padding:4px 7px;border:1px solid #333;border-radius:99px;color:#bbb}.success{color:var(--ok)}
@media(max-width:650px){.grid3{grid-template-columns:1fr 1fr}.macrogrid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.top button{max-width:145px}.setrow{grid-template-columns:24px 1fr 1fr 1fr 28px;font-size:12px}}
</style></head>
<body><main class="app">
<div class="top"><div><div class="brand">Jean Performance</div><div class="muted">V4 • treino, alimentação, água, recuperação e evolução</div></div><button class="small primary" onclick="exportData()">📤 Exportar evolução</button></div>
<div class="tabs" id="tabs"></div><section id="view"></section><div class="footer">Dados salvos localmente neste aparelho • V4</div>
</main><div id="modal" class="modal hidden" onclick="closeModal(event)"><div class="modalbox" id="modalbox"></div></div>
<script>
const PLAN={
"Segunda — Superior A":[["Supino reto",3,"6–10"],["Supino inclinado halteres",3,"8–12"],["Puxada alta",3,"8–12"],["Remada baixa",3,"8–12"],["Desenvolvimento",2,"8–12"],["Elevação lateral",3,"10–15"],["Tríceps corda",2,"10–15"],["Tríceps testa",2,"8–12"],["Rosca direta",2,"8–12"],["Rosca alternada",2,"10–12"],["Pallof press",3,"10–12/lado"]],
"Quarta — Pernas":[["Salto vertical (CMJ)",3,"3"],["Agachamento livre ou Hack Squat",3,"6–8"],["Leg press",3,"8–12"],["Mesa flexora",3,"8–12"],["Flexora unilateral",2,"10–12/lado"],["Cadeira extensora",2,"10–15"],["Panturrilha em pé",3,"10–15"],["Panturrilha sentado",2,"12–15"],["Copenhagen plank",2,"20–30 s/lado"],["Step-up ou Bulgarian split squat",2,"8–10/lado"],["Drop landing + estabilização",2,"4–5"]],
"Sexta — Superior B":[["Puxada na frente",3,"8–12"],["Remada unilateral",3,"8–12"],["Chest press/máquina",3,"8–12"],["Crucifixo máquina ou crossover",2,"10–15"],["Desenvolvimento",2,"8–12"],["Elevação lateral",3,"12–15"],["Rosca alternada",2,"10–12"],["Rosca martelo",2,"10–12"],["Tríceps corda",2,"10–15"],["Tríceps francês",2,"10–12"],["Prancha lateral",2,"30–45 s/lado"]]
};
const TABS=["Hoje","Treino","Alimentação","Água","Recuperação","Evolução"];let tab="Hoje",day="Segunda — Superior A";
const MEALS=[
 {id:'cafe',name:'Café da manhã',time:'Ao acordar',rules:'Base diária',options:[
  {name:'Ovos + fruta',items:['Ovos — 2–3 unidades','Fruta — 1 porção'],p:18,c:18,f:12,k:250},
  {name:'Aveia + iogurte',items:['Aveia — 3 colheres de sopa (~30 g)','Iogurte — 1 unidade (~170 g)'],p:13,c:30,f:7,k:230},
  {name:'Tapioca + fruta',items:['Tapioca — 2 colheres de sopa','Fruta — 1 porção'],p:3,c:35,f:1,k:170}
 ]},
 {id:'pre',name:'Pré-treino',time:'30–45 min antes',rules:'Priorizar nos dias com treino',options:[
  {name:'Banana + whey',items:['Banana média — ~120 g','Whey — 1 scoop (~30 g)'],p:25,c:28,f:3,k:240},
  {name:'Pão + ovos',items:['Pão — 1 unidade','Ovos — 2 unidades'],p:14,c:25,f:11,k:260},
  {name:'Iogurte + aveia',items:['Iogurte natural — 170 g','Aveia — 20 g'],p:8,c:22,f:4,k:150},
  {name:'Tapioca + frango',items:['Tapioca — 2 colheres de sopa','Frango — 100 g'],p:31,c:30,f:3,k:270}
 ]},
 {id:'almoco',name:'Almoço / pós-treino',time:'Refeição principal',rules:'Proteína + carboidrato + legumes',options:[
  {name:'Arroz + frango + legumes',items:['Arroz — 120–150 g','Frango — 150 g','Legumes — à vontade'],p:48,c:45,f:7,k:430},
  {name:'Arroz + carne + legumes',items:['Arroz — 120–150 g','Carne — 150 g','Legumes — à vontade'],p:40,c:45,f:14,k:500},
  {name:'Arroz + peixe + legumes',items:['Arroz — 120–150 g','Peixe — 150 g','Legumes — à vontade'],p:36,c:45,f:9,k:410},
  {name:'Arroz + ovos + legumes',items:['Arroz — 120 g','Ovos — 3 unidades','Legumes — à vontade'],p:24,c:37,f:18,k:410}
 ]},
 {id:'lanche',name:'Lanche da tarde',time:'Meio da tarde',rules:'Escolha uma opção',options:[
  {name:'Fruta + iogurte',items:['Fruta — 1 porção','Iogurte — ~150–170 g'],p:7,c:25,f:3,k:150},
  {name:'Pão + proteína',items:['Pão — 1 unidade','Proteína — porção adequada'],p:18,c:25,f:7,k:250},
  {name:'Banana + whey',items:['Banana — ~120 g','Whey — ~30 g'],p:25,c:28,f:3,k:240}
 ]},
 {id:'jantar',name:'Jantar / pós-treino',time:'Noite',rules:'Ajustado ao volume do dia',options:[
  {name:'Frango/carne + arroz',items:['Frango/carne — 180–200 g','Arroz — 100 g','Legumes — à vontade'],p:52,c:30,f:10,k:430},
  {name:'Frango/carne + batata',items:['Frango/carne — 180–200 g','Batata — 150 g','Legumes — à vontade'],p:52,c:30,f:10,k:420},
  {name:'Omelete + legumes',items:['Omelete — 3 ovos','Legumes — ~100 g'],p:19,c:8,f:18,k:270},
  {name:'Cuscuz + frango/carne',items:['Cuscuz — 100–150 g','Frango/carne — 180–200 g'],p:50,c:35,f:9,k:430}
 ]}
];
const DAYTYPE={0:'domingo',1:'superior',2:'futevolei',3:'pernas',4:'futevolei',5:'superior',6:'corrida'};
let db=JSON.parse(localStorage.getItem('jp_v4')||'{}');if(!localStorage.getItem('jp_v4')&&localStorage.getItem('jp_v3')){try{const old=JSON.parse(localStorage.getItem('jp_v3'));db={sessions:old.sessions||{},water:old.water||{},food:{},recovery:old.recovery||{},metrics:{}};for(const [d,f] of Object.entries(old.food||{})){db.food[d]={};for(const [name,val] of Object.entries(f||{})){const map={'Café da manhã':'cafe','Almoço':'almoco','Pré-treino':'pre','Pós-treino / jantar':'jantar','Lanche':'lanche'};if(map[name])db.food[d][map[name]]={done:!!val,option:0}}}localStorage.setItem('jp_v4',JSON.stringify(db))}catch(e){}}db.sessions=db.sessions||{};db.water=db.water||{};db.food=db.food||{};db.recovery=db.recovery||{};db.metrics=db.metrics||{};
function key(){return new Date().toISOString().slice(0,10)}function save(){localStorage.setItem('jp_v4',JSON.stringify(db))}
function dayType(){return DAYTYPE[new Date().getDay()]}
function macroTarget(){return {pMin:130,pMax:165,cMin:200,cMax:260,fMin:65,fMax:80}}
function mealPlanNote(){let t=dayType();if(t==='pernas'||t==='superior')return 'Dia de musculação: use a estrutura completa. Quarta/sexta têm maior demanda e podem usar a faixa superior de carboidrato do protocolo.';if(t==='corrida')return 'Sábado: priorize carboidrato antes da corrida e boa reidratação no pós-corrida.';if(t==='futevolei')return 'Dia de futevôlei técnico: estrutura-base normal, sem necessidade de carboidrato extra segundo o protocolo.';return 'Domingo: mantenha proteína e reduza levemente o carboidrato.'}
function render(){document.getElementById('tabs').innerHTML=TABS.map(x=>`<button class="${x===tab?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('');let v=document.getElementById('view');if(tab==='Hoje')v.innerHTML=home();if(tab==='Treino')v.innerHTML=training();if(tab==='Alimentação')v.innerHTML=food();if(tab==='Água')v.innerHTML=water();if(tab==='Recuperação')v.innerHTML=recovery();if(tab==='Evolução')v.innerHTML=evolution();}
function totals(){let f=db.food[key()]||{};let p=0,c=0,g=0,k=0,done=0;for(const m of MEALS){const x=f[m.id];if(x?.done){const o=m.options[x.option||0];p+=o.p;c+=o.c;g+=o.f;k+=o.k;done++}}return {p,c,g,k,done}}
function workoutTotals(){let s=db.sessions[key()]||{};let sets=0,vol=0,done=0;for(const x of Object.values(s)){if(!x?.sets)continue;for(const q of x.sets){if(q.load!==''||q.reps!=='')sets++;if(q.ok)done++;vol+=(+q.load||0)*(+q.reps||0)}}return {sets,done,vol}}
function home(){let n=totals(),w=db.water[key()]||0,wt=workoutTotals(),r=db.recovery[key()]||{};let sleep=r.sleep||'—',energy=r.energy||'—';return `<div class="card"><h2>Hoje</h2><p class="muted">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</p><div class="notice">${mealPlanNote()}</div><div class="grid"><div class="stat">🍽️ Refeições<b>${n.done}/${MEALS.length}</b></div><div class="stat">🥩 Proteína<b>${n.p} g</b><span class="tiny muted">meta 130–165 g</span></div><div class="stat">🍚 Carboidratos<b>${n.c} g</b><span class="tiny muted">meta 200–260 g</span></div><div class="stat">💧 Água<b>${w} ml</b></div><div class="stat">🏋️ Séries<b>${wt.done}</b><span class="tiny muted">registradas ${wt.sets}</span></div><div class="stat">🔥 Volume<b>${Math.round(wt.vol)} kg</b></div><div class="stat">😴 Sono<b>${sleep}${sleep!=='—'?' / 5':''}</b></div><div class="stat">⚡ Energia<b>${energy}${energy!=='—'?' / 5':''}</b></div></div></div><div class="card"><h3>Fechamento do dia</h3><ul class="summarylist"><li><span>Refeições concluídas</span><b>${n.done}/${MEALS.length}</b></li><li><span>Proteína</span><b>${n.p} g</b></li><li><span>Carboidratos</span><b>${n.c} g</b></li><li><span>Gorduras</span><b>${n.g} g</b></li><li><span>Calorias estimadas</span><b>${n.k} kcal</b></li><li><span>Água</span><b>${w} ml</b></li><li><span>Treino</span><b>${wt.done?'Registrado':'Ainda não registrado'}</b></li></ul></div><div class="card"><h3>Semana</h3>${['Segunda — Superior A','Terça — Futevôlei','Quarta — Futevôlei + Pernas','Quinta — Futevôlei','Sexta — Futevôlei + Superior B','Sábado — Corrida + Core','Domingo — Recuperação'].map(x=>`<div class="foodcard" style="margin:7px 0;padding:10px"><div class="row"><span>${x}</span><span class="tag">${x.includes('Pernas')||x.includes('Superior')?'força':x.includes('Corrida')?'corrida':x.includes('Futevôlei')?'técnica':'recuperação'}</span></div></div>`).join('')}</div>`}
function training(){return `<div class="daybar">${Object.keys(PLAN).map(k=>`<button class="${day===k?'active':''}" onclick="day='${k}';render()">${k.split(' — ')[0]}</button>`).join('')}</div><div class="card"><h2>${day}</h2><p class="muted">Carga, reps, RIR, séries concluídas, volume, última carga e melhor volume.</p>${PLAN[day].map((e,i)=>exercise(e,i)).join('')}<button class="small primary" onclick="finishWorkout()">Finalizar sessão</button></div>`}
function exercise(e,i){let [name,n,reps]=e,k=key(),s=((db.sessions[k]||{})[name])||{sets:Array.from({length:n},()=>({load:'',reps:'',rir:'',ok:false}))};while(s.sets.length<n)s.sets.push({load:'',reps:'',rir:'',ok:false});let vol=s.sets.reduce((a,x)=>a+(+x.load||0)*(+x.reps||0),0),last=lastData(name),best=bestData(name);return `<div class="exercise"><h3>${name}</h3><div class="meta">${n} séries • alvo ${reps}</div><div class="sets"><div class="setrow meta"><span>#</span><span>KG</span><span>REPS</span><span>RIR</span><span>✓</span></div>${s.sets.map((x,j)=>`<div class="setrow"><span class="setnum">${j+1}</span><input type="number" step="0.5" value="${x.load}" placeholder="kg" onchange="upd('${esc(name)}',${j},'load',this.value)"><input type="number" value="${x.reps}" placeholder="reps" onchange="upd('${esc(name)}',${j},'reps',this.value)"><input type="number" min="0" max="5" value="${x.rir}" placeholder="RIR" onchange="upd('${esc(name)}',${j},'rir',this.value)"><input class="check" type="checkbox" ${x.ok?'checked':''} onchange="upd('${esc(name)}',${j},'ok',this.checked)"></div>`).join('')}</div><div class="volume">Volume: ${vol.toFixed(1)} kg</div><div class="meta">Última: ${last?last.load+' kg × '+last.reps+' reps • RIR '+last.rir:'sem registro'}${best?' • Melhor volume: '+best.toFixed(1)+' kg':''}</div><div class="actions"><button class="small" onclick="yt('${esc(name)}')">▶ YouTube</button><button class="small" onclick="showChart('${esc(name)}')">📈 Histórico</button></div></div>`}
function esc(s){return s.replaceAll("'","\\'")}function upd(name,j,field,val){let k=key();db.sessions[k]=db.sessions[k]||{};db.sessions[k][name]=db.sessions[k][name]||{sets:[]};let s=db.sessions[k][name];while(s.sets.length<PLAN[day].find(e=>e[0]===name)[1])s.sets.push({load:'',reps:'',rir:'',ok:false});s.sets[j][field]=field==='ok'?val:Number(val)||'';s.done=s.sets.filter(x=>x.ok).length;save();render()}
function lastData(name){for(let d of Object.keys(db.sessions).sort().reverse()){let s=db.sessions[d][name];if(s?.sets){let z=[...s.sets].reverse().find(x=>x.load!==''||x.reps!=='');if(z)return z}}return null}function bestData(name){let best=0;for(let d in db.sessions){let s=db.sessions[d][name];if(s?.sets)best=Math.max(best,s.sets.reduce((a,x)=>a+(+x.load||0)*(+x.reps||0),0))}return best||null}function yt(n){location.href='https://www.youtube.com/results?search_query='+encodeURIComponent(n+' execução exercício')}function showChart(name){tab='Evolução';render();setTimeout(()=>{const s=document.getElementById('exerciseSelect');if(s)s.value=name;draw(name)},50)}function finishWorkout(){alert('Sessão salva. Os registros ficam neste aparelho.');save()}
function food(){let d=db.food[key()]||{};return `<div class="card"><h2>Alimentação de hoje</h2><p class="muted">${mealPlanNote()}</p><div class="grid"><div class="stat">🥩 Proteína<b>${totals().p} g</b><span class="tiny muted">meta 130–165 g</span></div><div class="stat">🍚 Carboidratos<b>${totals().c} g</b><span class="tiny muted">meta 200–260 g</span></div></div></div>${MEALS.map(m=>mealCard(m,d[m.id])).join('')}<div class="card"><h3>Resumo de consumo</h3>${macroBars(totals())}</div>`}
function mealCard(m,entry){let opt=(entry?.option??0),o=m.options[opt],done=!!entry?.done;return `<div class="foodcard ${done?'done':''}"><div class="foodhead"><div><div class="foodname">${m.name}</div><div class="muted tiny">${m.time} • ${m.rules}</div></div><input class="check" type="checkbox" ${done?'checked':''} onchange="mealDone('${m.id}',this.checked)"></div><div class="sectiontitle" style="margin-top:12px">Opção escolhida</div>${m.options.map((x,i)=>`<div class="mealoption ${i===opt?'selected':''}" onclick="mealOption('${m.id}',${i})"><div class="line"><b>${x.name}</b><span class="tag">${x.k} kcal est.</span></div>${x.items.map(it=>`<div class="ingredient">• ${it}</div>`).join('')}<div class="macrogrid"><div class="macro"><span>Proteína</span><b>${x.p} g</b></div><div class="macro"><span>Carbo</span><b>${x.c} g</b></div><div class="macro"><span>Gordura</span><b>${x.f} g</b></div><div class="macro"><span>Energia</span><b>${x.k}</b></div></div></div>`).join('')}</div>`}
function mealDone(id,v){db.food[key()]=db.food[key()]||{};db.food[key()][id]=db.food[key()][id]||{option:0};db.food[key()][id].done=v;save();render()}function mealOption(id,i){db.food[key()]=db.food[key()]||{};db.food[key()][id]=db.food[key()][id]||{};db.food[key()][id].option=i;save();render()}
function macroBars(n){let t=macroTarget();return `<div class="foodcard"><div class="row"><b>Proteína</b><span>${n.p} / ${t.pMin}–${t.pMax} g</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,n.p/t.pMax*100)}%"></div></div></div><div class="foodcard"><div class="row"><b>Carboidratos</b><span>${n.c} / ${t.cMin}–${t.cMax} g</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,n.c/t.cMax*100)}%"></div></div></div><div class="foodcard"><div class="row"><b>Gorduras</b><span>${n.g} / ${t.fMin}–${t.fMax} g</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,n.g/t.fMax*100)}%"></div></div></div>`}
function water(){let v=db.water[key()]||0;return `<div class="card"><h2>Água</h2><p class="muted">Acompanhe o consumo; o protocolo orienta ajustar a hidratação conforme sede, suor, clima e intensidade.</p><div class="stat"><span class="muted">Registrado hoje</span><b>${v} ml</b></div><div class="waterbar" style="margin-top:10px"><div class="waterfill" style="width:${Math.min(100,v/30)}%"></div></div><div class="actions">${[250,500,750,1000].map(x=>`<button class="small" onclick="addWater(${x})">+${x} ml</button>`).join('')}<button class="small" onclick="setWater(0)">Zerar</button></div><h3 class="sectiontitle">Registros de hoje</h3><div class="muted tiny">Cada toque adiciona ao total do dia.</div></div>`}
function addWater(x){setWater((db.water[key()]||0)+x)}function setWater(x){db.water[key()]=x;save();render()}
function recovery(){let d=db.recovery[key()]||{};return `<div class="card"><h2>Recuperação</h2><p class="muted">Check-in rápido do dia.</p>${[['Sono','sleep'],['Energia','energy'],['Dor','pain'],['Estresse','stress'],['Disposição para treinar','readiness']].map(([a,b])=>`<div class="food"><span>${a}</span><select onchange="rec('${b}',this.value)"><option value="">—</option>${[1,2,3,4,5].map(x=>`<option value="${x}" ${String(d[b])===String(x)?'selected':''}>${x}/5</option>`).join('')}</select></div>`).join('')}<div class="notice">O protocolo também recomenda acompanhar peso 1–2x/semana, cintura semanal, fotos e evolução das cargas/repetições.</div><div class="actions"><button class="small primary" onclick="openMetrics()">📏 Registrar peso/cintura</button></div></div>`}
function rec(k,v){db.recovery[key()]=db.recovery[key()]||{};db.recovery[key()][k]=v;save()}
function openMetrics(){let d=db.metrics[key()]||{};openModal(`<h2>Medidas de hoje</h2><label class="muted">Peso (kg)</label><input class="input" id="mweight" type="number" step="0.1" value="${d.weight||''}"><label class="muted">Cintura (cm)</label><input class="input" id="mwaist" type="number" step="0.1" value="${d.waist||''}"><div class="actions"><button class="small primary" onclick="saveMetrics()">Salvar</button><button class="small" onclick="closeModal()">Cancelar</button></div>`)}function saveMetrics(){db.metrics[key()]={weight:Number(document.getElementById('mweight').value)||'',waist:Number(document.getElementById('mwaist').value)||''};save();closeModal();render()}
function evolution(){let names=[...new Set(Object.values(PLAN).flat().map(x=>x[0]))];return `<div class="card"><h2>Evolução</h2><select id="exerciseSelect" class="input" onchange="draw(this.value)">${names.map(n=>`<option>${n}</option>`).join('')}</select><canvas id="chart" class="chart" width="900" height="220"></canvas><p class="muted tiny">Volume por sessão (kg × reps).</p></div><div class="grid"><div class="card"><h3>Peso</h3>${metricHistory('weight','kg')}</div><div class="card"><h3>Cintura</h3>${metricHistory('waist','cm')}</div></div><div class="card"><h3>Consistência</h3>${consistency()}</div>`}
function metricHistory(field,unit){let arr=Object.keys(db.metrics).sort().slice(-8).map(d=>({d,v:db.metrics[d][field]})).filter(x=>x.v);return arr.length?arr.reverse().map(x=>`<div class="food"><span>${new Date(x.d+'T12:00:00').toLocaleDateString('pt-BR')}</span><b>${x.v} ${unit}</b></div>`).join(''):'<span class="muted">Sem registros.</span>'}
function consistency(){let dates=new Set([...Object.keys(db.sessions),...Object.keys(db.food)]),a=[...dates].sort().slice(-7),done=a.filter(d=>{let f=db.food[d]||{};return Object.values(f).some(x=>x?.done)}).length;return `<div class="grid"><div class="stat">Dias registrados<b>${a.length}/7</b></div><div class="stat">Dias com alimentação<b>${done}/7</b></div></div>`}
function draw(name){let c=document.getElementById('chart');if(!c)return;let ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let vals=Object.keys(db.sessions).sort().map(d=>({d,v:(db.sessions[d][name]?.sets||[]).reduce((a,x)=>a+(+x.load||0)*(+x.reps||0),0)})).filter(x=>x.v>0).slice(-10);ctx.strokeStyle='#777';ctx.beginPath();ctx.moveTo(35,10);ctx.lineTo(35,h-30);ctx.lineTo(w-10,h-30);ctx.stroke();if(!vals.length){ctx.fillStyle='#aaa';ctx.fillText('Sem dados ainda',50,80);return}let max=Math.max(...vals.map(x=>x.v),1),step=(w-55)/Math.max(vals.length-1,1);ctx.strokeStyle='#fff';ctx.beginPath();vals.forEach((x,i)=>{let px=35+i*step,py=h-30-(x.v/max)*(h-55);i?ctx.lineTo(px,py):ctx.moveTo(px,py);ctx.fillStyle='#fff';ctx.fillText(Math.round(x.v),px-10,py-8)});ctx.stroke()}
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.add('hidden')}
function exportData(){save();const sessions=db.sessions||{},dates=Object.keys(sessions).sort();let totalVolume=0,totalSets=0,completedSets=0;const exerciseSummary={};for(const date of dates)for(const [name,s] of Object.entries(sessions[date]||{})){if(!s?.sets)continue;let vol=0;for(const x of s.sets){const load=+x.load||0,reps=+x.reps||0;if(x.load!==''||x.reps!=='')totalSets++;if(x.ok)completedSets++;vol+=load*reps}totalVolume+=vol;exerciseSummary[name]=exerciseSummary[name]||{sessions:0,totalVolume:0,bestSessionVolume:0};exerciseSummary[name].sessions++;exerciseSummary[name].totalVolume+=vol;exerciseSummary[name].bestSessionVolume=Math.max(exerciseSummary[name].bestSessionVolume,vol)}const payload={exportFormat:'Jean Performance Evolution',exportVersion:2,appVersion:'V4',exportedAt:new Date().toISOString(),period:{firstRecordedDate:dates[0]||null,lastRecordedDate:dates.at(-1)||null},targets:macroTarget(),summary:{trainingDays:dates.length,totalRecordedSets:totalSets,completedSets,totalVolumeKg:+totalVolume.toFixed(2)},exerciseSummary,data:{sessions:db.sessions,water:db.water,food:db.food,recovery:db.recovery,metrics:db.metrics}};const stamp=new Date().toISOString().slice(0,10),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`jean-performance-evolucao-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('Exportação V4 criada. Guarde o JSON; depois de 8 semanas, envie-o aqui para análise.')}
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      await reg.update();
    }catch(e){}
  });
}
render();
</script></body></html>
